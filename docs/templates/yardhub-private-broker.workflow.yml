name: YARDHUB Private Broker Inbox

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  invoke-pinned-broker:
    if: github.event.issue.pull_request == null && github.event.comment.user.type == 'User'
    uses: aka30art/DowntimeUI/.github/workflows/yardhub-github-broker.yml@<PINNED_40_CHARACTER_COMMIT_SHA>
    with:
      source_ref: ${{ vars.DOWNTIMEUI_REF }}
      broker_repository_id: ${{ github.repository_id }}
      data_owner: ${{ vars.YARDHUB_DATA_OWNER }}
      data_repository: ${{ vars.YARDHUB_DATA_REPOSITORY }}
      data_repository_id: ${{ vars.YARDHUB_DATA_REPOSITORY_ID }}
      data_app_id: ${{ vars.YARDHUB_DATA_APP_ID }}
      data_app_installation_id: ${{ vars.YARDHUB_DATA_APP_INSTALLATION_ID }}
      data_branch: ${{ vars.YARDHUB_DATA_BRANCH }}
      edge_origin: ${{ vars.YARDHUB_EDGE_ORIGIN }}
      bootstrap_github_user_id: ${{ vars.YARDHUB_BOOTSTRAP_GITHUB_USER_ID }}
      bootstrap_issue_id: ${{ vars.YARDHUB_BOOTSTRAP_ISSUE_ID }}
    secrets:
      data_app_private_key: ${{ secrets.YARDHUB_DATA_APP_PRIVATE_KEY }}
      broker_ecdh_private_key: ${{ secrets.YARDHUB_BROKER_ECDH_PRIVATE_KEY }}
