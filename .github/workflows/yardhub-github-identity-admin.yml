name: YARDHUB Broker Identity Administration

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable DowntimeUI source commit SHA
        required: true
        type: string
      broker_repository_id:
        required: true
        type: string
      data_owner:
        required: true
        type: string
      data_repository:
        required: true
        type: string
      data_repository_id:
        required: true
        type: string
      data_app_id:
        required: true
        type: string
      data_app_installation_id:
        required: true
        type: string
      data_branch:
        required: false
        default: data/yardhub
        type: string
      bootstrap_github_user_id:
        required: false
        default: ""
        type: string
      bootstrap_issue_id:
        required: false
        default: ""
        type: string
    secrets:
      data_app_private_key:
        required: true

jobs:
  administer-broker-identities:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Fetch immutable YARDHUB broker source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_ref must be an immutable 40-character commit SHA."
            exit 1
          fi
          git init yardhub-source
          git -C yardhub-source remote add origin https://github.com/aka30art/DowntimeUI.git
          git -C yardhub-source fetch --depth=1 origin "$SOURCE_REF"
          git -C yardhub-source -c advice.detachedHead=false checkout --detach FETCH_HEAD

      - name: Execute DEV-authorized identity administration
        working-directory: yardhub-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YARDHUB_BROKER_REPOSITORY_ID: ${{ inputs.broker_repository_id }}
          YARDHUB_DATA_OWNER: ${{ inputs.data_owner }}
          YARDHUB_DATA_REPOSITORY: ${{ inputs.data_repository }}
          YARDHUB_DATA_REPOSITORY_ID: ${{ inputs.data_repository_id }}
          YARDHUB_DATA_APP_ID: ${{ inputs.data_app_id }}
          YARDHUB_DATA_APP_INSTALLATION_ID: ${{ inputs.data_app_installation_id }}
          YARDHUB_DATA_APP_PRIVATE_KEY: ${{ secrets.data_app_private_key }}
          YARDHUB_DATA_BRANCH: ${{ inputs.data_branch }}
          YARDHUB_BROKER_BOOTSTRAP_GITHUB_USER_ID: ${{ inputs.bootstrap_github_user_id }}
          YARDHUB_BROKER_BOOTSTRAP_ISSUE_ID: ${{ inputs.bootstrap_issue_id }}
        run: node scripts/manage-github-broker-identity.mjs
