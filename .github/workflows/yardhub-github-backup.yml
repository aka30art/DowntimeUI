name: YARDHUB GitHub Backup

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yardhub-primary-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Replicate YARDHUB primary to private GitHub data repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DOWNTIMEUI backup bridge
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export YARDHUB tables and storage to GitHub
        run: node scripts/yardhub-backup-to-github.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YARDHUB_DATA_REPOSITORY: ${{ secrets.YARDHUB_DATA_REPOSITORY }}
          YARDHUB_DATA_BRANCH: ${{ secrets.YARDHUB_DATA_BRANCH }}
          YARDHUB_DATA_TOKEN: ${{ secrets.YARDHUB_DATA_TOKEN }}
